# =============================================================================
# LogOps — Fluent Bit main config
# Reads local log files, parses them, enriches with geo-country, ships to MSK.
# =============================================================================

[SERVICE]
    # Flush buffers to outputs every second
    Flush        1
    # Log Fluent Bit's own messages at info level
    Log_Level    info
    # Enable a tiny HTTP health endpoint for Docker healthchecks
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    # Load custom parsers (JSON + nginx combined)
    Parsers_File parsers.conf

# ---------------------------------------------------------------------------
# INPUT: follow the JSON application log file written by the log generator
# ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               app.logs
    Path              /var/log/logops/app_logs.json
    Parser            json
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    DB                /tmp/flb_app_logs.db

# ---------------------------------------------------------------------------
# INPUT: follow nginx-style access logs
# ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /var/log/logops/nginx_access.log
    Parser            nginx
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    DB                /tmp/flb_nginx_logs.db

# ---------------------------------------------------------------------------
# FILTER: run Lua script to add a mock geo_country field from client IP
# ---------------------------------------------------------------------------
[FILTER]
    Name    lua
    Match   *
    script  /fluent-bit/etc/enrich.lua
    call    enrich_record

# ---------------------------------------------------------------------------
# FILTER: add a static host / pipeline tag so consumers know the source
# ---------------------------------------------------------------------------
[FILTER]
    Name    modify
    Match   *
    Add     pipeline logops
    Add     host logops-ec2

# ---------------------------------------------------------------------------
# OUTPUT: send every matched record to AWS MSK Kafka
# Replace the broker URL via docker-compose env substitution or edit below.
# ---------------------------------------------------------------------------
[OUTPUT]
    Name            kafka
    Match           *
    Brokers         ${MSK_BOOTSTRAP_SERVERS}
    Topics          ${KAFKA_TOPIC}
    Timestamp_Key   timestamp
    Retry_Limit     5
    rdkafka.message.timeout.ms 5000
    rdkafka.socket.timeout.ms  5000
    rdkafka.queue.buffering.max.ms 1000

# ---------------------------------------------------------------------------
# OUTPUT: also print to stdout so beginners can `docker logs` and learn
# ---------------------------------------------------------------------------
[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines
