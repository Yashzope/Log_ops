# =============================================================================
# LogOps — Docker Compose stack
# Runs on the EC2 Airflow host. Uses AWS MSK for Kafka in production.
# Local Kafka/Zookeeper services are present but COMMENTED OUT by default.
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__EMAIL__EMAIL_CONN_ID: smtp_default
    AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW_SMTP_HOST}
    AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_SMTP_USER}
    AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_SMTP_MAIL_FROM}
    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    DATABRICKS_JOB_BRONZE_ID: ${DATABRICKS_JOB_BRONZE_ID:-0}
    DATABRICKS_JOB_SILVER_DLT_ID: ${DATABRICKS_JOB_SILVER_DLT_ID:-0}
    DATABRICKS_JOB_GOLD_ID: ${DATABRICKS_JOB_GOLD_ID:-0}
    DATABRICKS_SQL_WAREHOUSE_ID: ${DATABRICKS_SQL_WAREHOUSE_ID:-}
    DATABRICKS_EXISTING_CLUSTER_ID: ${DATABRICKS_EXISTING_CLUSTER_ID:-}
    DATABRICKS_BRONZE_NOTEBOOK_PATH: ${DATABRICKS_BRONZE_NOTEBOOK_PATH:-/Workspace/logops/01_bronze_streaming}
    DATABRICKS_GOLD_NOTEBOOK_PATH: ${DATABRICKS_GOLD_NOTEBOOK_PATH:-/Workspace/logops/03_gold_aggregations}
    DATABRICKS_CONN_ID: ${DATABRICKS_CONN_ID:-databricks_default}
    KAFKA_TOPIC: ${KAFKA_TOPIC:-logops.raw.logs}
    ALERT_EMAIL: ${ALERT_EMAIL:-alerts@example.com}
    AWS_REGION: ${AWS_REGION:-ap-south-1}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    MSK_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS}
    S3_BUCKET: ${S3_BUCKET}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-databricks==6.0.0 requests==2.31.0
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./databricks-notebooks:/opt/airflow/databricks-notebooks
  user: "${AIRFLOW_UID}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    airflow-redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # LOCAL Kafka stack — ONLY enable if you are NOT using AWS MSK.
  # Flag: USE_LOCAL_KAFKA=false by default. Uncomment zookeeper + kafka below
  # when developing offline without MSK.
  # ---------------------------------------------------------------------------
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.5.3
  #   container_name: logops-zookeeper
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #   volumes:
  #     - zookeeper-data:/var/lib/zookeeper/data
  #   healthcheck:
  #     test: ["CMD", "nc", "-z", "localhost", "2181"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped
  #
  # kafka:
  #   image: confluentinc/cp-kafka:7.5.3
  #   container_name: logops-kafka
  #   depends_on:
  #     zookeeper:
  #       condition: service_healthy
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  #   volumes:
  #     - kafka-data:/var/lib/kafka/data
  #   healthcheck:
  #     test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 8
  #   restart: unless-stopped

  # Kafka UI — points at MSK bootstrap servers by default
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    container_name: logops-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: logops-msk
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${MSK_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ClickHouse — fast OLAP database for log analytics and Grafana
  clickhouse:
    image: clickhouse/clickhouse-server:23.12
    container_name: logops-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: logops
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Keep a copy inside the container for the one-shot init job below
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Apply schema reliably (initdb.d alone is easy to miss on reused volumes)
  clickhouse-init:
    image: clickhouse/clickhouse-server:23.12
    container_name: logops-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/init.sql:/init.sql:ro
      - ./clickhouse/apply-init.sh:/apply-init.sh:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
    entrypoint: ["/bin/bash", "/apply-init.sh"]
    restart: "no"

  # MinIO — S3-compatible object store for local/dev Delta experiments
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: logops-minio
    command: server /data --console-address ":9001"
    ports:
      # Host 9001 is often blocked by Windows Hyper-V reserved ranges
      - "19001:9001"
      - "9002:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Airflow metadata database
  airflow-postgres:
    image: postgres:15
    container_name: logops-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis — Celery message broker for Airflow workers
  airflow-redis:
    image: redis:7.2-alpine
    container_name: logops-airflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-redis-data:/data
    restart: unless-stopped

  # One-shot init: migrate DB metadata and create the admin user
  airflow-init:
    <<: *airflow-common
    container_name: logops-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins}
        # Official image hooks: migrate DB then create admin from env vars below
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      # Init runs as root for chown; pip-as-root is blocked by the Airflow image
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    user: "0:0"
    restart: "no"

  # Airflow web UI
  airflow-webserver:
    <<: *airflow-common
    container_name: logops-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow scheduler — decides which tasks run when
  airflow-scheduler:
    <<: *airflow-common
    container_name: logops-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow Celery worker — executes the actual task code
  airflow-worker:
    <<: *airflow-common
    container_name: logops-airflow-worker
    command: celery worker
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Grafana — dashboards for ClickHouse and Prometheus metrics
  grafana:
    image: grafana/grafana:10.3.1
    container_name: logops-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Used by provisioning/datasources/datasources.yml ${...} substitution
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: create Superset admin from .env (official image does not do this itself)
  superset-init:
    image: apache/superset:3.1.0
    container_name: logops-superset-init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@logops.demo}
    volumes:
      - superset-data:/app/superset_home
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        superset db upgrade
        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USER}" \
          --firstname Admin \
          --lastname LogOps \
          --email "$${SUPERSET_ADMIN_EMAIL}" \
          --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        superset fab reset-password \
          --username "$${SUPERSET_ADMIN_USER}" \
          --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        superset init
    restart: "no"

  # Apache Superset — SQL exploration UI over ClickHouse / warehouses
  superset:
    image: apache/superset:3.1.0
    container_name: logops-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - superset-data:/app/superset_home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Fluent Bit — ships local log files to MSK Kafka
  fluent-bit:
    image: fluent/fluent-bit:2.2.2
    container_name: logops-fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./fluent-bit/enrich.lua:/fluent-bit/etc/enrich.lua:ro
      - logops-logs:/var/log/logops:ro
    environment:
      MSK_BOOTSTRAP_SERVERS: ${MSK_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
    healthcheck:
      disable: true
    restart: unless-stopped

  # Fake log generator — writes JSON + nginx logs Fluent Bit will tail
  log-generator:
    build:
      context: ./log-generator
    container_name: logops-log-generator
    volumes:
      - logops-logs:/var/log/logops
    environment:
      LOG_DIR: /var/log/logops
      SLEEP_MIN_SECONDS: "0.5"
      SLEEP_MAX_SECONDS: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/logops/app_logs.json"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  clickhouse-data:
  minio-data:
  airflow-postgres-data:
  airflow-redis-data:
  grafana-data:
  superset-data:
  logops-logs:
  # Uncomment if using local Kafka:
  # zookeeper-data:
  # kafka-data:
